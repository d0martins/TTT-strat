[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttt-strat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "numba",
    "scipy",
    "gpxpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "cyipopt",
]
docs = [
    "sphinx",
    "furo",
    "myst-parser",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["D"]   # pytest hooks are not public API

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no solver I/O",
    "solver: dedicated solver tests, gated behind --solver-tests",
]
